let AC=null,master=null,musBus=null,dly=null,musicOn=OPT.music;
function initAudio(){
 if(AC){if(AC.state!=='running'){AC.resume().catch(()=>{});}return;}
 try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
  musBus=AC.createGain();musBus.gain.value=0.45;musBus.connect(master);
  dly=AC.createDelay(1);dly.delayTime.value=0.27;const fb=AC.createGain();fb.gain.value=0.34;const df=AC.createBiquadFilter();df.type='lowpass';df.frequency.value=2100;
  dly.connect(df);df.connect(fb);fb.connect(dly);df.connect(musBus);mNext=AC.currentTime+0.05;}catch(e){AC=null;}
}
function osc(type,f,t,d,vol,o={}){
 if(!AC)return;const os=AC.createOscillator(),g=AC.createGain();os.type=type;os.frequency.setValueAtTime(f,t);
 if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+d);
 if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=5.5;lg.gain.value=f*0.012;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+d+0.05);}
 let node=os;if(o.cut){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.cut;fl.Q.value=o.q||1;os.connect(fl);node=fl;}
 node.connect(g);g.connect(o.dest||master);
 if(o.send&&dly){const s=AC.createGain();s.gain.value=o.send;g.connect(s);s.connect(dly);}
 const att=o.att||0.004;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 os.start(t);os.stop(t+d+0.05);
}
let noiseBuf=null;
function nz(t,d,vol,type='highpass',f=1000,dest){
 if(!AC)return;if(!noiseBuf){const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,n);const c=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;}
 const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=AC.createGain();
 s.connect(fl);fl.connect(g);g.connect(dest||master);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.start(t,Math.random()*0.5);s.stop(t+d+0.02);
}

function buildSong(S){
 const sc=SCALES[S.sc],r=mulberry32(S.seed*999);
 const note=d=>{const o=Math.floor(d/7),i=((d%7)+7)%7;return S.key+o*12+sc[i];};
 S.bars=S.prog.map(c=>({root:note(c),tri:[note(c),note(c+2),note(c+4)]}));
 S.lead=[];let d=7+S.prog[0];
 for(let i=0;i<64;i++){const bar=Math.floor(i/16),st=i%16,c=S.prog[bar];let v=null;
  if(st%2===0&&r()<(st%4===0?0.85:0.5)){const ct=[c,c+2,c+4,c+7];if(r()<0.6)d=7+ct[Math.floor(r()*4)];else d+=r()<0.5?1:-1;d=clamp(d,5,16);v=note(d)+12;}
  S.lead.push(v);}
 for(let i=0;i<16;i++)S.lead[32+i]=S.lead[i];
}
Object.values(SONGS).forEach(buildSong);
let song=null,mStep=0,mNext=0;
function getSong(n){if(!n)return null;if(SONGS[n])return SONGS[n];const [b,v]=n.split('_');const B=SONGS[b]||SONGS.forest;const S={bpm:B.bpm+(v==='storm'?14:v==='ride'?22:v==='deep'?10:v==='raft'?6:v==='fort'?8:v==='chasm'?4:-6),key:B.key+(v==='chasm'?2:v==='fort'?-2:0),sc:B.sc,prog:v==='storm'?[B.prog[0],B.prog[3],B.prog[1],B.prog[2]]:B.prog.slice().reverse(),drum:Math.min(3,B.drum+(v==='storm'||v==='fort'||v==='ride'||v==='deep'?1:0)),seed:B.seed*3+v.length};buildSong(S);SONGS[n]=S;return S;}
function setMusic(n){const s=getSong(n);if(song===s)return;song=s;mStep=0;if(AC)mNext=AC.currentTime+0.05;}
const mf=n=>440*Math.pow(2,(n-69)/12);
function musicTick(){
 if(!AC||!song)return;if(mNext<AC.currentTime)mNext=AC.currentTime+0.02;
 const st=60/song.bpm/4;
 while(mNext<AC.currentTime+0.2){if(musicOn)playStep(song,mStep,mNext,st);mNext+=st;mStep=(mStep+1)%64;}
}
const BASSP=[1,0,0,1,0,0,1,0,1,0,0,1,0,1,0,0];
function playStep(S,i,t,st){
 const bar=S.bars[Math.floor(i/16)],s=i%16,D=S.drum;
 if(D===4){// muzyka bossa: pędzący bas, dysonanse, ciężkie bębny
  osc('sawtooth',mf(bar.root-12+(s%4===2?12:0)),t,st*0.9,0.09,{cut:900,q:6,dest:musBus});
  if(s===0){osc('sawtooth',mf(bar.root-24),t,st*16,0.06,{cut:260,q:3,dest:musBus,att:0.02});nz(t,0.6,0.12,'highpass',4000,musBus);}
  if(s===0||s===6||s===10){for(const n of [bar.root,bar.root+1,bar.root+6])osc('square',mf(n+12),t,st*1.2,0.022,{cut:2200,dest:musBus,send:0.2});}
  if(s%4===0||s===14||s===15)osc('sine',160,t,0.13,0.4,{slide:38,dest:musBus});
  if(s===4||s===12)nz(t,0.14,0.22,'bandpass',1600,musBus);if(i%16===15&&Math.floor(i/16)===3)for(let k=0;k<4;k++)nz(t+k*st/4,0.06,0.15,'bandpass',2200,musBus);
  nz(t,0.025,0.045,'highpass',8000,musBus);
  const L=S.lead[i];if(L){osc('sawtooth',mf(L),t,st*1.6,0.04,{cut:2400,dest:musBus,send:0.35});osc('sawtooth',mf(L)*1.006,t,st*1.6,0.025,{cut:2400,dest:musBus});}
  return;}
 if(BASSP[s]||(D===0&&s%8===0))osc('sawtooth',mf(bar.root-12),t,st*(D===0?6:1.6),0.09,{cut:380+(s===0?320:0),q:5,dest:musBus});
 if(s===0)for(const n of bar.tri)osc('triangle',mf(n),t,st*15,0.032,{dest:musBus,att:0.1,send:0.2});
 if(D>=1){const n=bar.tri[s%3]+12+(s%6>=3?12:0);osc('square',mf(n),t,st*0.8,0.02,{cut:1700,dest:musBus,send:0.25});}
 const L=S.lead[i];if(L)osc(D>=3?'sawtooth':'square',mf(L),t,st*(D===0?3.5:1.8),0.042,{cut:D>=3?2200:2800,dest:musBus,send:0.42,vib:D===0});
 if(D>=1){if(s===0||s===8||(D>=3&&s===10))osc('sine',150,t,0.14,0.32,{slide:40,dest:musBus});
  if(D>=2&&(s===4||s===12))nz(t,0.12,0.16,'bandpass',1800,musBus);
  if(D>=2&&s%2===0)nz(t,0.03,0.045,'highpass',7000,musBus);
  if(D>=3&&s%2===1)nz(t,0.02,0.025,'highpass',9000,musBus);}
}

const INTRO={
 ride:'Przewodnik watahy pada u twoich stóp. Reszta wilków ucieka — prócz jednego młodego basiora, który przygląda ci się bez strachu. Znak na twojej dłoni ciepło pulsuje. Wilk podchodzi i pozwala się dosiąść. Zwiadowcy wroga uciekają przez równinę — goń ich!',
 deep:'Strażnik Wrót rozsypuje się w gruz, odsłaniając zejście do Katakumb Zakonu. Korytarz prowadzi prosto do kryształu, który karmi mrokiem tę krainę. Nie ma tu bocznych ścieżek — tylko naprzód, w stronę nadciągających wrogów.',
 raft:'Kapitan Przeprawy nie żyje, a jego tratwa kołysze się przy pomoście. Nurt poniesie cię szybciej niż jakakolwiek ścieżka — jeśli przeżyjesz zasadzki z brzegów i skały ukryte w wodzie.',
 slide:'Wódz Yeti pada, a jego ogromna tarcza zjeżdża po zboczu. Siadasz na niej i odpychasz się od lodu — przed tobą najdłuższy zjazd w Lodowym Szczycie.',

 floe:'Mroźny Przewoźnik zostawia swój bosak. Rzeka niesie kry szybko, a brzegi pilnują wrogowie. Jedyna droga prowadzi po lodzie, który tonie pod nogami.',
 cart:'Nadzorca Kopalni pada na tory. Jego wagonik stoi gotowy, a szyny prowadzą nad lawą prosto w serce Krainy Płomieni. Trzymaj się mocno!',

 tube:'Za Strażnikiem Wiru otwiera się tunel, który kręci się jak trąba powietrzna. W Wirze Otchłani nie ma góry ani dołu.',

 boss:'Ziemia drży. Przed tobą legowisko władcy tej krainy — strażnika jednej z pięciu pieczęci. Odpocznij przy ognisku i przygotuj się do walki.',

 for(let y=0;y<VH;y+=2){const t=y/VH*n,i=Math.min(n-1,Math.floor(t));let f=t-i;f=Math.floor(f*5)/5;x.fillStyle=lerpC(cols[i],cols[i+1],f);x.fillRect(0,y,VW,2);

function wheelInput(){const own=armsOwned();
 if(K.wheel){wheel.t++;if(wheel.t===1){wheel.sel=ARMS.findIndex(a=>a.id===P.arm);}if(wheel.t>10&&own.length>1)wheel.open=true;}
 else if(wheel.t>0){if(wheel.open){const A=ARMS[wheel.sel];if(own.includes(A)&&A.id!==P.arm){P.arm=A.id;sfx('sel');ftext(pcx(),P.y-8,A.n,A.c);}}
  else if(own.length>1){const i=own.findIndex(a=>a.id===P.arm);const A=own[(i+1)%own.length];P.arm=A.id;sfx('sel');ftext(pcx(),P.y-8,A.n,A.c);}else if(wheel.t<10)ftext(pcx(),P.y-8,'Pieczęcie otworzą nowe bronie','#a89878');
  wheel.t=0;wheel.open=false;P.atk=null;}
 if(wheel.open){if(pr('right')||pr('down'))wheel.sel=(wheel.sel+1)%ARMS.length;if(pr('left')||pr('up'))wheel.sel=(wheel.sel+ARMS.length-1)%ARMS.length;
  const [ax,ay]=padAx;if(Math.hypot(ax,ay)>0.6){let a=Math.atan2(ay,ax)+Math.PI/2;if(a<0)a+=6.283;wheel.sel=Math.round(a/6.283*ARMS.length)%ARMS.length;}
  if(frame%4!==0)return true;}
 return false;}

 attackers=0;for(const e of ents)if(!e.dead&&!e.isBoss&&MELEE_ST[e.state])attackers++;

 ents=ents.filter(e=>!e.dead||!e.summoned);
 updShots();updItems();updCrumbles();updProps();updParticles();
 if(arena&&!arena.started&&!bossDone&&P.x>arena.trigger*T)startBoss();
 if(clearT>0){clearT--;if(clearT===60){P.atk=null;}if(clearT===0){P.hp=P.maxHp;stageComplete();return;}}

}
