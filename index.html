let AC=null,master=null,musBus=null,dly=null,musicOn=OPT.music;
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
  musBus=AC.createGain();musBus.gain.value=0.45;musBus.connect(master);
  dly=AC.createDelay(1);dly.delayTime.value=0.27;const fb=AC.createGain();fb.gain.value=0.34;const df=AC.createBiquadFilter();df.type='lowpass';df.frequency.value=2100;
  dly.connect(df);df.connect(fb);fb.connect(dly);df.connect(musBus);mNext=AC.currentTime+0.05;}catch(e){AC=null;}
}
function osc(type,f,t,d,vol,o={}){
 if(!AC)return;const os=AC.createOscillator(),g=AC.createGain();os.type=type;os.frequency.setValueAtTime(f,t);
 if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+d);
 if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=5.5;lg.gain.value=f*0.012;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+d+0.05);}
 let node=os;if(o.cut){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.cut;fl.Q.value=o.q||1;os.connect(fl);node=fl;}
 node.connect(g);g.connect(o.dest||master);
 if(o.send&&dly){const s=AC.createGain();s.gain.value=o.send;g.connect(s);s.connect(dly);}
 const att=o.att||0.004;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 os.start(t);os.stop(t+d+0.05);
}
let noiseBuf=null;
function nz(t,d,vol,type='highpass',f=1000,dest){
 if(!AC)return;if(!noiseBuf){const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,n);const c=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;}
 const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=AC.createGain();
 s.connect(fl);fl.connect(g);g.connect(dest||master);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.start(t,Math.random()*0.5);s.stop(t+d+0.02);
}

function buildSong(S){
 const sc=SCALES[S.sc],r=mulberry32(S.seed*999);
 const note=d=>{const o=Math.floor(d/7),i=((d%7)+7)%7;return S.key+o*12+sc[i];};
 S.bars=S.prog.map(c=>({root:note(c),tri:[note(c),note(c+2),note(c+4)]}));
 S.lead=[];let d=7+S.prog[0];
 for(let i=0;i<64;i++){const bar=Math.floor(i/16),st=i%16,c=S.prog[bar];let v=null;
  if(st%2===0&&r()<(st%4===0?0.85:0.5)){const ct=[c,c+2,c+4,c+7];if(r()<0.6)d=7+ct[Math.floor(r()*4)];else d+=r()<0.5?1:-1;d=clamp(d,5,16);v=note(d)+12;}
  S.lead.push(v);}
 for(let i=0;i<16;i++)S.lead[32+i]=S.lead[i];
}
Object.values(SONGS).forEach(buildSong);
let song=null,mStep=0,mNext=0;
function setMusic(n){const s=n?SONGS[n]:null;if(song===s)return;song=s;mStep=0;if(AC)mNext=AC.currentTime+0.05;}
const mf=n=>440*Math.pow(2,(n-69)/12);
function musicTick(){
 if(!AC||!song)return;if(mNext<AC.currentTime)mNext=AC.currentTime+0.02;
 const st=60/song.bpm/4;
 while(mNext<AC.currentTime+0.2){if(musicOn)playStep(song,mStep,mNext,st);mNext+=st;mStep=(mStep+1)%64;}
}
const BASSP=[1,0,0,1,0,0,1,0,1,0,0,1,0,1,0,0];
function playStep(S,i,t,st){
 const bar=S.bars[Math.floor(i/16)],s=i%16,D=S.drum;
 if(BASSP[s]||(D===0&&s%8===0))osc('sawtooth',mf(bar.root-12),t,st*(D===0?6:1.6),0.09,{cut:380+(s===0?320:0),q:5,dest:musBus});
 if(s===0)for(const n of bar.tri)osc('triangle',mf(n),t,st*15,0.032,{dest:musBus,att:0.1,send:0.2});
 if(D>=1){const n=bar.tri[s%3]+12+(s%6>=3?12:0);osc('square',mf(n),t,st*0.8,0.02,{cut:1700,dest:musBus,send:0.25});}
 const L=S.lead[i];if(L)osc(D>=3?'sawtooth':'square',mf(L),t,st*(D===0?3.5:1.8),0.042,{cut:D>=3?2200:2800,dest:musBus,send:0.42,vib:D===0});
 if(D>=1){if(s===0||s===8||(D>=3&&s===10))osc('sine',150,t,0.14,0.32,{slide:40,dest:musBus});
  if(D>=2&&(s===4||s===12))nz(t,0.12,0.16,'bandpass',1800,musBus);
  if(D>=2&&s%2===0)nz(t,0.03,0.045,'highpass',7000,musBus);
  if(D>=3&&s%2===1)nz(t,0.02,0.025,'highpass',9000,musBus);}
}

function tile(tx,ty){if(tx<0||tx>=MW)return '#';if(ty<0||ty>=MH)return ' ';return map[ty][tx];}
function solidAt(tx,ty){const c=tile(tx,ty);if(c==='#'||c==='G'||c==='i')return true;if(c==='x'){const cr=crumbles[tx+','+ty];return !(cr&&cr.gone);}return false;}
function moveX(e,dx){
 e.x+=dx;const top=Math.floor(e.y/T),bot=Math.floor((e.y+e.h-0.01)/T);
 if(dx>0){const tx=Math.floor((e.x+e.w)/T);for(let ty=top;ty<=bot;ty++)if(solidAt(tx,ty)){e.x=tx*T-e.w;e.vx=0;return true;}}
 else if(dx<0){const tx=Math.floor(e.x/T);for(let ty=top;ty<=bot;ty++)if(solidAt(tx,ty)){e.x=(tx+1)*T;e.vx=0;return true;}}
 return false;
}
function moveY(e,dy){
 const oldBot=e.y+e.h;e.y+=dy;const l=Math.floor(e.x/T),r=Math.floor((e.x+e.w-0.01)/T);e.onGround=false;
 if(dy>=0){const ty=Math.floor((e.y+e.h)/T);for(let tx=l;tx<=r;tx++){const c=tile(tx,ty);
  if(solidAt(tx,ty)||(c==='='&&oldBot<=ty*T+0.5&&!(e.dropT>0))){e.y=ty*T-e.h;e.vy=0;e.onGround=true;return true;}}}
 else{const ty=Math.floor(e.y/T);for(let tx=l;tx<=r;tx++)if(solidAt(tx,ty)){e.y=(ty+1)*T;e.vy=0;return true;}}

function wave(x,dir,type,dmg,h=14,sp=2.6){shoot({type,x:x-5,y:arena.row*T-h,w:10,h,vx:dir*sp,life:220,dmg});}
upd.troll=e=>{
 const dx=pcx()-ecx(e),adx=Math.abs(dx),dir=Math.sign(dx)||1,ph2=e.hp<e.maxHp*0.5,R=D.react*(ph2?0.8:1);
 switch(e.state){
  case 'intro':e.vx=0;if(e.t===40){sfx('roar');shake=12;}if(e.t>100){e.state='walk';e.t=0;e.cd=40;}break;
  case 'walk':e.face=dir;e.vx=adx>30?dir*(ph2?0.9:0.6):0;if(e.t>e.cd){e.t=0;if(adx<56)e.state='swingW';else if(ph2&&Math.random()<0.4)e.state='chargeW';else e.state='leapW';}break;
  case 'swingW':e.vx=0;if(e.t>=35*R){e.state='swing';e.t=0;sfx('heavy');}break;
  case 'swing':eHit(e,{x:e.face>0?e.x+e.w-6:e.x-36,y:e.y+4,w:42,h:34},20);if(e.t>=10){e.state='rec';e.t=0;e.rt=40;}break;
  case 'leapW':e.vx=0;if(e.t>=26*R){e.state='leap';e.t=0;e.vy=-7.2;e.vx=clamp(dx/41,-4,4);}break;
  case 'leap':if(e.vy>0)eHit(e,e,18);if(e.onGround&&e.t>5){sfx('boom');shake=12;wave(ecx(e),-1,'wave',15);wave(ecx(e),1,'wave',15);if(ph2)rockRain(2,'rock',14);dust(ecx(e),e.y+e.h,12);e.state='rec';e.t=0;e.rt=50;e.vx=0;}break;
  case 'chargeW':e.vx=0;e.face=dir;if(e.t>=30*R){e.state='charge';e.t=0;sfx('roar');}break;
  case 'charge':e.vx=e.face*3.6;eHit(e,e,20);if(frame%3===0)dust(ecx(e),e.y+e.h,2);if(wallAhead(e,e.face)||e.t>90){e.state='stun';e.t=0;shake=14;sfx('boom');rockRain(3,'rock',14);e.vx=0;}break;
  case 'stun':e.vx=0;if(e.t>=70){e.state='walk';e.t=0;e.cd=20;}break;
  case 'rec':e.vx*=0.8;if(e.t>=e.rt){e.state='walk';e.t=0;e.cd=(ph2?30:50)*D.react;}break;
 }};
upd.witch=e=>{
 const ph2=e.hp<e.maxHp*0.5,R=D.react*(ph2?0.8:1),gy=arena.row*T;e.face=pcx()<ecx(e)?-1:1;
 const go=(tx,ty)=>{e.vx+=(tx-e.x)*0.02;e.vy+=(ty-e.y)*0.02;e.vx*=0.85;e.vy*=0.85;};
 switch(e.state){
  case 'intro':e.invuln=true;e.alpha=Math.min(1,e.t/60);go(e.ax,e.ay);if(e.t===50)sfx('magic');if(e.t>100){e.state='float';e.t=0;e.invuln=false;}break;
  case 'float':go(e.ax,e.ay+Math.sin(e.t*0.05)*6);if(e.t>=50*R){e.t=0;e.casts=(e.casts||0)+1;const r=Math.random();
   if(ph2&&r<0.25)e.state='ring';else if(ph2&&r<0.45&&ents.filter(b=>b.summoned&&!b.dead).length<2)e.state='summon';else if(r<0.72)e.state='fan';else e.state='wisp';}break;
  case 'fan':go(e.ax,e.ay);if(e.t>=30*R){const sx=ecx(e),sy=e.y+10,a=Math.atan2(pcy()-sy,pcx()-sx);for(let i=-2;i<=2;i++)shoot({type:'orb',x:sx-3,y:sy-3,vx:Math.cos(a+i*0.22)*2.1,vy:Math.sin(a+i*0.22)*2.1,dmg:12*e.dm,c:'#b080ff'});sfx('magic');e.state='after';e.t=0;}break;
  case 'ring':go(e.ax,e.ay);if(e.t>=40*R){const sx=ecx(e),sy=e.y+10;for(let i=0;i<12;i++){const a=i/12*6.283+e.t;shoot({type:'orb',x:sx-3,y:sy-3,vx:Math.cos(a)*1.5,vy:Math.sin(a)*1.5,dmg:12*e.dm,c:'#80d0ff'});}sfx('magic');e.state='after';e.t=0;}break;
  case 'wisp':go(e.ax,e.ay);if(e.t>=25*R){for(let i=0;i<(ph2?2:1);i++)shoot({type:'wisp',x:ecx(e)-4+i*8,y:e.y,w:8,h:8,vx:(i?1:-1)*1,vy:-1,sp:1.15,life:300,dmg:12*e.dm,destroy:true});sfx('magic');e.state='after';e.t=0;}break;
  case 'summon':go(e.ax,e.ay);if(e.t>=35*R){for(const s of [-1,1]){const b=mkEnemy('bat',ecx(e)+s*16,e.y+10);b.state='fly';b.summoned=true;b.xp=2;b.gold=0;ents.push(b);}sfx('magic');e.state='after';e.t=0;}break;
  case 'after':go(e.ax,e.ay);if(e.t>=30){e.t=0;if(e.casts>=2){e.casts=0;e.state='tired';}else e.state='float';}break;
  case 'tired':go(e.ax,gy-e.h-4);if(e.t>=Math.round(110*(ph2?0.8:1))){e.state='tpOut';e.t=0;}break;
  case 'tpOut':e.invuln=true;e.alpha=1-e.t/25;if(e.t>=25){let nx;do{nx=rand(arena.px0+24,arena.px1-40);}while(Math.abs(nx-pcx())<70);e.ax=nx;e.ay=gy-rand(72,96);e.x=e.ax;e.y=e.ay;e.vx=e.vy=0;e.state='tpIn';e.t=0;}break;
  case 'tpIn':e.alpha=e.t/25;if(e.t>=25){e.invuln=false;e.alpha=1;e.state='float';e.t=0;}break;
 }
 e.x+=e.vx;e.y+=e.vy;e.x=clamp(e.x,arena.px0+4,arena.px1-e.w-4);e.y=clamp(e.y,gy-140,gy-e.h);};
upd.worm=e=>{
 const ph2=e.hp<e.maxHp*0.5,R=D.react*(ph2?0.8:1),gy=arena.row*T;
 switch(e.state){
  case 'intro':e.y=gy-e.h;e.hidden=false;if(e.t===30){sfx('roar');shake=12;}if(e.t>100){e.state='dive';e.t=0;}break;
  case 'dive':e.invuln=true;e.y+=2.6;if(e.y>=gy+4){e.state='under';e.t=0;e.hidden=true;}break;
  case 'under':e.hidden=true;e.invuln=true;e.x+=clamp(pcx()-ecx(e),-1,1)*(ph2?2.2:1.6);if(frame%5===0)parts.push({x:ecx(e)+rand(-8,8),y:gy,vx:0,vy:-0.6,life:20,max:20,c:'#6a5a3a',s:2,g:0});
   if(e.t>=Math.round((ph2?55:75)*R)){e.state='rumble';e.t=0;}break;
  case 'rumble':if(frame%2===0)dust(ecx(e)+rand(-10,10),gy,2);shake=2;if(e.t>=Math.round(30*R)){e.state='burst';e.t=0;e.hidden=false;e.y=gy-4;sfx('boom');shake=10;burst(ecx(e),gy,'#6a5a3a',20,3);}break;
  case 'burst':e.y-=6;eHit(e,e,22);if(e.y<=gy-e.h){e.y=gy-e.h;e.state='exposed';e.t=0;e.invuln=false;}break;
  case 'exposed':e.face=pcx()<ecx(e)?-1:1;
   if((ph2&&(e.t===30||e.t===60))||(!ph2&&e.t===40)){const n=ph2?3:1;for(let i=0;i<n;i++){const sx=ecx(e),sy=e.y+6,tt=40+i*8,vx=(pcx()-sx)/tt+(i-1)*0.5,vy=(pcy()-sy-0.5*0.15*tt*tt)/tt;shoot({type:'glob',x:sx-3,y:sy,vx,vy,g:0.15,dmg:13*e.dm});}sfx('splash');}
   if(e.t>=Math.round(95*(ph2?0.85:1))){e.state='dive';e.t=0;}break;
 }
 e.x=clamp(e.x,arena.px0+4,arena.px1-e.w-4);};
function knightUpd(e){
 const lord=e.type==='lord',exe=e.type==='exec',dx=pcx()-ecx(e),adx=Math.abs(dx),dir=Math.sign(dx)||1,hpf=e.hp/e.maxHp,ph=hpf<0.3?3:hpf<0.6?2:1,R=D.react*(ph===3?0.75:ph===2?0.88:1);
 e.frontHits=Math.max(0,(e.frontHits||0)-0.01);e.far=adx>120?(e.far||0)+1:0;
 switch(e.state){
  case 'intro':if(e.t===40){sfx('roar');shake=10;}if(e.t>100){e.state='stalk';e.t=0;e.cd=40;}break;
  case 'stalk':e.face=dir;e.vx=adx>44?dir*(lord?1.05:0.95)*(ph>1?1.15:1):(adx<28?-dir*0.6:0);
   if(e.frontHits>=3){e.state='guard';e.t=0;e.frontHits=0;e.vx=0;break;}
   if(e.t>e.cd||e.far>150){e.t=0;e.far=0;const r=Math.random();
    if(adx<60&&r<0.7){e.state='combo';e.step=0;}
    else if(ph>=2&&r<0.5)e.state=(lord||exe)?'fireW':'shardW';
    else if((lord?ph>=3:ph>=2)&&r<0.75)e.state=lord||exe?'ashW':'icefallW';
    else e.state='thrustW';}break;
  case 'combo':{const winds=[20,14,24],dmgs=[18,18,26],s=e.step,wd=Math.round(winds[s]*R);e.vx*=0.8;
   if(e.t===1)e.face=dir;if(e.t===wd){sfx(s===2?'heavy':'swing');e.vx=e.face*2;}
   if(e.t>wd&&e.t<=wd+8)eHit(e,{x:e.face>0?e.x+e.w-4:e.x-30,y:e.y+2,w:34,h:30},dmgs[s]);
   if(e.t>=wd+8+(s===2?36:6)){e.t=0;e.step++;if(e.step>=3){e.state='stalk';e.cd=(ph>1?35:55)*D.react;}}break;}
  case 'thrustW':e.vx=0;e.face=dir;if(e.t>=40*R){e.state='thrust';e.t=0;sfx('dash');}break;
  case 'thrust':e.vx=e.face*(lord?6:5.2);eHit(e,e,24);if(frame%2===0)parts.push({x:e.x,y:e.y,w:e.w,h:e.h,ghost:1,life:10,max:10,vx:0,vy:0,g:0,c:lord?'#f63':'#9ef'});
   if(e.t>=22||wallAhead(e,e.face)){e.state='rec';e.t=0;e.rt=45;e.vx=0;}break;
  case 'fireW':e.vx=0;if(e.t>=35*R){const wt=exe?'wave':'fire';wave(ecx(e),-1,wt,20,exe?16:22,2.8);wave(ecx(e),1,wt,20,exe?16:22,2.8);shake=8;sfx('boom');e.state='rec';e.t=0;e.rt=40;}break;
  case 'shardW':e.vx=0;e.face=dir;if(e.t>=32*R){for(let i=-1;i<=1;i++){const sx=ecx(e),sy=e.y+8,tt=34+i*6,vx=(pcx()-sx)/tt+i*0.6,vy=(pcy()-sy-0.5*0.12*tt*tt)/tt;shoot({type:'shard',x:sx-3,y:sy,vx,vy,g:0.12,dmg:14*e.dm});}
   wave(ecx(e),e.face,'frost',16,12,2.4);sfx('shoot');e.state='rec';e.t=0;e.rt=40;}break;
  case 'ashW':case 'icefallW':e.vx=0;if(e.t>=40*R){rockRain(lord?10:7,lord?'ember':exe?'rock':'ice',14*e.dm);sfx('magic');e.state='rec';e.t=0;e.rt=50;}break;
  case 'guard':e.vx=0;e.face=dir;if(e.t>=40){e.state='stalk';e.t=0;}break;
  case 'riposte':e.vx=0;if(e.t>=10){e.state='thrust';e.t=0;e.face=dir;}break;
  case 'rec':e.vx*=0.8;if(e.t>=e.rt){e.state='stalk';e.t=0;e.cd=(ph>1?30:50)*D.react;}break;
 }}
upd.lord=knightUpd;upd.jarl=knightUpd;upd.exec=knightUpd;
function lockGate(on){for(let ty=0;ty<arena.row;ty++)map[ty][arena.gate]=on?'G':' ';}
function startBoss(){arena.started=true;lockGate(true);const t=arena.boss;boss=mkEnemy(t,arena.bossX*T+8,arena.row*T);boss.state='intro';boss.face=-1;
 if(t==='witch'){boss.ax=boss.x;boss.ay=arena.row*T-90;boss.y=boss.ay;boss.alpha=0;}
 if(t==='worm'){boss.y=arena.row*T-boss.h;}
 ents.push(boss);setMusic('boss');banner={a:boss.name,b:'',t:150};}


function updEnemy(e){
 e.t++;if(e.flash>0)e.flash--;if(e.slow>0)e.slow--;
 if(e.burn>0){e.burn--;if(e.burn%20===0){const d=Math.max(1,Math.round(baseDmg()*0.15));e.hp-=d;ftext(ecx(e),e.y,d,'#ff9040');if(e.hp<=0){killEnemy(e);return;}}if(frame%4===0)parts.push({x:ecx(e)+rand(-4,4),y:e.y+rand(0,e.h),vx:0,vy:-0.8,life:16,max:16,c:'#ff8030',s:2,g:0});}
 if(!e.isBoss&&Math.abs(ecx(e)-(cam.x+VW/2))>VW*0.9&&e.state!=='dive')return;
 if(e.state==='hurt'){e.vx*=0.85;if(e.type==='bat')e.vy*=0.85;if(e.t>=14){e.t=0;
  e.state=e.type==='bat'?'fly':e.type==='archer'?'kite':e.type==='wolf'?'stalk':e.type==='toad'?'aim':e.type==='cultist'?'idle':'chase';
  if(e.type==='goblin'&&Math.random()<0.35&&!ledgeAhead(e,-Math.sign(pcx()-ecx(e)))){e.state='hop';e.vy=-3.5;e.vx=-Math.sign(pcx()-ecx(e))*2;}}}
 else upd[e.type](e);
 if(e.cd>0)e.cd--;
 if(e.slow>0&&!e.isBoss)e.vx*=0.55;
 const fly=ETYPES[e.type].fly;
 if(e.type==='witch'||e.type==='worm')return;
 if(fly){e.bonk=moveX(e,e.vx);if(moveY(e,e.vy))e.bonk=true;}
 else{e.vy=Math.min(7,e.vy+0.35);moveX(e,e.vx*(e.slow>0&&e.isBoss?0.7:1));moveY(e,e.vy);}
 if(e.y>MH*T+60)e.dead=true;
 if(!e.isBoss&&e.state!=='hang'){const l=Math.floor(e.x/T),r=Math.floor((e.x+e.w-1)/T),ty=Math.floor((e.y+e.h-2)/T);for(let tx=l;tx<=r;tx++){const c=tile(tx,ty);if(c==='^'||c==='~'){e.hp=0;killEnemy(e);return;}}}
}

function updShots(){
 for(const s of shots){if(s.life<=0)continue;s.life--;
  if(s.warn>0){s.warn--;if(s.warn===0){s.y=cy0-14;s.vy=1;}continue;}
  if(s.type==='wisp'){const a=Math.atan2(pcy()-(s.y+4),pcx()-(s.x+4)),cur=Math.atan2(s.vy,s.vx);let da=a-cur;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;const na=cur+clamp(da,-0.035,0.035);s.vx=Math.cos(na)*s.sp;s.vy=Math.sin(na)*s.sp;}
  if(s.g)s.vy+=s.g;
  if(s.type==='rock'||s.type==='ember'||s.type==='ice')s.vy=Math.min(6,s.vy+0.25);
  s.x+=s.vx;s.y+=s.vy;
  if(s.type==='wave'||s.type==='fire'||s.type==='frost'){const fx=s.vx>0?s.x+s.w:s.x;if(solidAt(Math.floor(fx/T),Math.floor((s.y+s.h-2)/T))||fx<arena.px0||fx>arena.px1)s.life=0;
   if(frame%2===0)parts.push({x:s.x+rand(0,s.w),y:s.y+rand(0,s.h),vx:0,vy:-1,life:14,max:14,c:s.type==='fire'?'#ff9030':s.type==='frost'?'#cff':'#8a7a5a',s:2,g:0});}
  else if(solidAt(Math.floor((s.x+s.w/2)/T),Math.floor((s.y+s.h/2)/T))){s.life=0;burst(s.x+s.w/2,s.y+s.h/2,s.type==='ember'?'#f84':s.type==='ice'||s.type==='shard'?'#cff':'#aaa',6,1.5);}
  if(s.life>0&&overlap(s,P)&&P.inv<=0&&!P.dead){hurtPlayer(s.dmg,s.x+s.w/2);if(s.type!=='wave'&&s.type!=='fire'&&s.type!=='frost')s.life=0;}
 }shots=shots.filter(s=>s.life>0);}

function touchCrumble(tx,ty){const k=tx+','+ty;let c=crumbles[k];if(!c)c=crumbles[k]={t:0,gone:false,r:0};if(!c.gone&&c.t===0){c.t=1;sfx('crack');}}
function updCrumbles(){for(const k in crumbles){const c=crumbles[k];if(c.gone){c.r--;if(c.r<=0){const [tx,ty]=k.split(',').map(Number);if(!overlap(P,{x:tx*T,y:ty*T,w:T,h:T})){c.gone=false;c.t=0;}}}
 else if(c.t>0){c.t++;if(c.t>28){c.gone=true;c.r=200;const [tx,ty]=k.split(',').map(Number);for(let i=0;i<6;i++)parts.push({x:tx*T+rand(0,16),y:ty*T+rand(0,8),vx:rand(-0.5,0.5),vy:rand(0,1),life:40,max:40,c:'#8a7a6a',s:3,g:0.2});}}}}
function updProps(){for(const p of props){if(p.state==='gone')continue;p.t++;
 if(p.state==='hang'){if(Math.abs(pcx()-(p.x+3))<22&&P.y>p.y&&P.y-p.y<160){p.state='shake';p.t=0;}}
 else if(p.state==='shake'){if(p.t>=24){p.state='fall';p.vy=0;}}
 else if(p.state==='fall'){p.vy+=0.4;p.y+=p.vy;if(overlap(p,P)&&P.inv<=0){hurtPlayer(14*(1+gi()*0.05),p.x+3);p.state='gone';burst(p.x+3,p.y+10,'#cff',8,2);}
  else if(solidAt(Math.floor((p.x+3)/T),Math.floor((p.y+p.h)/T))||p.y>MH*T){p.state='gone';burst(p.x+3,p.y+p.h,'#cff',10,2);sfx('crack');}}}}
function updParticles(){for(const p of parts){p.life--;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0;}parts=parts.filter(p=>p.life>0);if(parts.length>600)parts.splice(0,parts.length-600);
 for(const f of ftx){f.t--;f.y-=0.5;}ftx=ftx.filter(f=>f.t>0);}

function newPlayer(){return {x:0,y:0,w:10,h:22,vx:0,vy:0,face:1,onGround:false,coyote:0,jbuf:0,airJumps:0,airDash:0,dashT:0,dashCD:0,wall:0,wjLock:0,atk:null,combo:0,comboT:0,inv:0,hurtT:0,
 hp:100,maxHp:100,xp:0,lvl:1,gold:0,sp:0,flasks:2,maxFlasks:2,healT:0,rage:0,skills:{},hpUp:0,strUp:0,anim:0,dropT:0,dead:false,lastSafe:{x:0,y:0},calm:0,dashId:0,
 arm:'sword',mast:{sword:{lv:1,xp:0},spear:{lv:1,xp:0},magic:{lv:1,xp:0},bow:{lv:1,xp:0},axe:{lv:1,xp:0}},forge:{sword:0,spear:0,magic:0,bow:0,axe:0},
 mana:100,lives:3,coinCount:0,blocking:false,blockT:0,sw:false,plat:null,cd:0};}
function armsOwned(){return ARMS.filter(a=>PROF&&PROF.seals>=a.seal);}
function hasSeal(i){return PROF&&PROF.seals>=i;}
function maxMana(){return 100+(P.skills.focus?40:0);}
function mastLv(a){return (P.mast[a]||{lv:1}).lv;}
function mastNeed(l){return Math.round(70*Math.pow(l,1.7));}
function baseDmg(a){a=a||P.arm;return 10*(1+0.35*(P.forge[a]||0))*(1+0.12*(mastLv(a)-1))*(1+0.06*P.strUp)*(1+(P.lvl-1)*0.02);}
function maxAirDash(){return P.skills.dash2?2:1;}
function gainMastery(a,n){const m=P.mast[a];if(!m||m.lv>=5)return;m.xp+=n;while(m.lv<5&&m.xp>=mastNeed(m.lv)){m.xp-=mastNeed(m.lv);m.lv++;const A=ARMS.find(x=>x.id===a);say('Mistrzostwo: '+A.n+' '+m.lv+(m.lv===3?' — nowa technika!':''));sfx('lvl');}}

function startAttack(){
 const p=P,A=p.arm,m=mastLv(A);if(p.cd>0)return;
 if(A==='bow'){p.atk={kind:'bow',t:0,charge:0,id:++atkSeq};return;}
 if(A==='magic'){castSpell();return;}
 if(!p.onGround&&K.down&&p.skills.pogo){p.atk={kind:'down',t:0,wind:3,act:9,rec:8,id:++atkSeq,dmg:A==='axe'?1.6:A==='spear'?1.3:1.15};sfx('swing');return;}
 if(A==='spear'&&K.up){p.atk={kind:'up',t:0,wind:4,act:7,rec:10,id:++atkSeq,dmg:1.25};sfx('swing');return;}
 if(p.comboT<=0)p.combo=0;

function updTraps(){
 const f=frame;
 if(CUR.flags.wind){gust=(f%360)<150?1:0;}
 if(CUR.flags.lava&&!bossDone){lavaY-=0.11+gi()*0.002;const safe=P.y+P.h+150;if(lavaY>safe)lavaY=safe;}
 for(const t of traps){
  if(t.k==='pend'){t.a=Math.sin(f*t.sp+t.ph)*1.05;const bx=t.x+Math.sin(t.a)*t.L,by=t.y+Math.cos(t.a)*t.L;t.bx=bx;t.by=by;
   if(Math.abs(bx-cx0-VW/2)<VW){if(Math.abs(Math.cos(t.a))>0.995&&f%8===0)sfx('swing');}
   const hb={x:bx-11,y:by-8,w:22,h:16};if(overlap(hb,P))lethalHit(bx);}
  else if(t.k==='mover'){const nx=t.x0+(Math.sin(f*0.012*t.sp+t.ph)*0.5+0.5)*(t.x1-t.x0);t.dx=t.x===undefined?0:nx-t.x;t.dy=0;t.x=nx;}
  else if(t.k==='lift'){const ny=t.y1+(Math.sin(f*0.012*t.sp+t.ph)*0.5+0.5)*(t.y0-t.y1);t.dy=t.y===undefined?0:ny-t.y;t.dx=0;t.y=ny;}
  else if(t.k==='fall'){t.dx=0;t.dy=0;if(t.state==='shake'){t.t++;if(t.t>22){t.state='drop';t.vy=0;}}
   else if(t.state==='drop'){t.vy=Math.min(6,(t.vy||0)+0.3);t.dy=t.vy;t.y+=t.vy;if(t.y>MH*T+40){t.state='gone';t.t=0;}}
   else if(t.state==='gone'){t.t++;if(t.t>200){t.state='idle';t.y=t.y0;}}}
  else if(t.k==='crush'){t.t++;
   if(t.state==='up'){if(t.t>40&&Math.abs(pcx()-(t.x+t.w/2))<30&&P.y>t.y){t.state='shake';t.t=0;}}
   else if(t.state==='shake'){if(t.t>16){t.state='slam';t.vy=0;}}
   else if(t.state==='slam'){t.vy=Math.min(9,(t.vy||0)+0.9);t.y+=t.vy;if(overlap({x:t.x+2,y:t.y,w:t.w-4,h:t.h},P))lethalHit(t.x+t.w/2);if(t.y+t.h>=t.gy){t.y=t.gy-t.h;t.state='wait';t.t=0;shake=Math.max(shake,5);sfx('boom');dust(t.x+t.w/2,t.gy,8);}}
   else if(t.state==='wait'){if(t.t>50){t.state='rise';}}
   else if(t.state==='rise'){t.y-=0.8;if(t.y<=t.y0){t.y=t.y0;t.state='up';t.t=0;}}}
  else if(t.k==='jet'){const c=(f+t.ph)%t.per;t.on=c>=40&&c<85;t.warn=c>=10&&c<40;
   if(t.warn&&f%5===0)parts.push({x:t.x+6+rand(-3,3),y:t.y-2,vx:0,vy:-0.6,life:16,max:16,c:'#a98',s:2,g:0});
   if(t.on){if(f%2===0)parts.push({x:t.x+6+rand(-4,4),y:t.y-rand(0,46),vx:0,vy:-1.2,life:14,max:14,c:Math.random()<0.5?'#ff8030':'#ffd060',s:3,g:0});
    if(overlap({x:t.x,y:t.y-46,w:12,h:46},P))hurtPlayer(20*(1+gi()*0.05),t.x+6,{unblockable:1});}}

  const [ax,ay]=padAx;if(Math.hypot(ax,ay)>0.6){let a=Math.atan2(ay,ax)+Math.PI/2;if(a<0)a+=6.283;wheel.sel=Math.round(a/6.283*ARMS.length)%ARMS.length;}

 return false;}
